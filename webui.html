<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clawd · instalador</title>
<style>
  :root{--o:#d97757;--o2:#e9a184;--bg:#111214;--card:#1b1d21;--line:#2a2d33;--txt:#e8e8ea;--mut:#9aa0aa;}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1100px 520px at 82% -10%,#2a1c17,transparent),var(--bg);color:var(--txt);
       font:16px/1.5 system-ui,'Segoe UI',DejaVu Sans,sans-serif;min-height:100vh}
  .wrap{max-width:880px;margin:0 auto;padding:34px 22px 70px}
  header{display:flex;align-items:center;gap:20px}
  header img{width:104px;filter:drop-shadow(0 8px 22px rgba(217,119,87,.35))}
  h1{margin:0;font-size:31px;color:var(--o);letter-spacing:-.5px}
  header p{margin:3px 0 0;color:var(--mut)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:22px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .card h3{margin:0 0 4px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
  .card .v{font-size:19px;font-weight:700}
  .ok{color:#5fd38a}.bad{color:#e06c6c}
  h2{margin:28px 0 10px;font-size:18px}
  .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:11px;padding:11px 16px;font-size:15px;
         cursor:pointer;font-weight:600;transition:.15s}
  button:hover{border-color:var(--o);color:var(--o2)}
  button.primary{background:var(--o);color:#141414;border-color:var(--o)}
  button.primary:hover{background:var(--o2);color:#141414}
  button.danger:hover{border-color:#e06c6c;color:#e06c6c}
  .tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .tabs button{border:0;border-radius:0;background:transparent;padding:9px 16px}
  .tabs button.act{background:var(--o);color:#141414}
  select{width:100%;margin-top:10px;background:var(--card);color:var(--txt);border:1px solid var(--line);
         border-radius:11px;padding:11px 12px;font-size:15px}
  select:focus{outline:none;border-color:var(--o)}
  #modelInfo{margin-top:8px;color:var(--mut);font-size:13.5px}
  #modelInfo b{color:var(--o)}
  .tag{display:inline-block;background:#262626;border-radius:999px;padding:1px 9px;font-size:12px;margin-left:6px}
  #log{margin-top:18px;background:#0c0d0f;border:1px solid var(--line);border-radius:11px;padding:13px;
       font:13px/1.6 ui-monospace,Menlo,monospace;color:#c9cdd4;white-space:pre-wrap;min-height:44px;max-height:220px;overflow:auto}
  .sp{display:inline-block;width:14px;height:14px;border:2px solid var(--o);border-top-color:transparent;border-radius:50%;
      animation:s .7s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/clawd.png" alt="Clawd">
    <div><h1>Clawd</h1><p>Instalador · mascota de escritorio de Claude Code</p></div>
  </header>

  <div class="grid" id="status"></div>

  <h2>1 · Preparar el sistema</h2>
  <div class="row">
    <button class="primary" onclick="go('deps')">Instalar dependencias</button>
    <button onclick="go('ollama')">Instalar Ollama</button>
  </div>

  <h2>2 · Elige el cerebro</h2>
  <div class="tabs">
    <button id="tab-local" class="act" onclick="setCat('local')">Local (Ollama)</button>
    <button id="tab-cloud" onclick="setCat('cloud')">Nube (NVIDIA / Kimi)</button>
  </div>
  <select id="modelSel" onchange="onSel()"></select>
  <div id="modelInfo"></div>

  <h2>3 · Instalar y arrancar</h2>
  <div class="row">
    <button class="primary" id="btnInstall">Instalar Clawd</button>
    <button id="btnPull">Descargar modelo</button>
    <button onclick="go('start')">Arrancar</button>
    <button onclick="go('stop')">Detener</button>
    <button class="danger" onclick="if(confirm('¿Desinstalar Clawd?'))go('uninstall')">Desinstalar</button>
  </div>

  <div id="log">Listo. Elige un paso…</div>
</div>

<script>
const MODELS=[
 // local (Ollama)
 ["qwen2.5:0.5b","~0.4 GB",1,"muy básico","local"],
 ["qwen2.5:1.5b","~1.0 GB",2,"básico","local"],
 ["qwen3:1.7b","~1.4 GB",2,"básico","local"],
 ["qwen2.5:3b","~2.0 GB",3,"aceptable","local"],
 ["qwen3:4b","~2.7 GB",3,"aceptable","local"],
 ["gemma3:4b","~3.3 GB",3,"multimodal","local"],
 ["llama3.1:8b","~4.7 GB",4,"bueno","local"],
 ["deepseek-r1:8b","~5.0 GB",4,"razona paso a paso","local"],
 ["qwen3:8b","~5.2 GB",4,"de los mejores","local"],
 ["gemma3:12b","~8.1 GB",5,"muy bueno","local"],
 ["phi4:14b","~9.1 GB",5,"muy bueno","local"],
 ["qwen3:14b","~9.3 GB",5,"el más completo","local"],
 // nube
 ["kimi-k3:cloud","nube",5,"Ollama Cloud · requiere cuenta","cloud"],
 ["deepseek-ai/deepseek-v4.1-flash","nube",5,"NVIDIA · rápido y fuerte","cloud"],
 ["z-ai/glm-5.3","nube",5,"NVIDIA · muy capaz","cloud"],
 ["z-ai/glm-5.3-flash","nube",4,"NVIDIA · rápido","cloud"],
 ["moonshotai/kimi-k3","nube",5,"NVIDIA · el más potente","cloud"],
 ["openai/gpt-oss-20b","nube",4,"NVIDIA · abierto","cloud"],
 ["google/gemma-4-31b-it","nube",5,"NVIDIA","cloud"],
 ["meta/llama-3.2-90b-vision-instruct","nube",5,"NVIDIA · ve imágenes","cloud"],
 ["mistralai/mistral-large-2-instruct","nube",5,"NVIDIA","cloud"],
 ["nvidia/nemotron-3-ultra-550b-a55b","nube",5,"NVIDIA · 550B","cloud"],
 ["nvidia/nemotron-3-super-120b-a12b","nube",5,"NVIDIA · 120B","cloud"],
 ["nvidia/nemotron-3.5-lightning-30b-a3b","nube",4,"NVIDIA · veloz","cloud"],
 ["writer/palmyra-creative-122b","nube",4,"NVIDIA · creativo","cloud"]
];
let cat="local", sel="qwen2.5:1.5b", st={};
const log=m=>document.getElementById('log').textContent=m;
const busy=m=>document.getElementById('log').innerHTML='<span class="sp"></span>'+m;
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
const isNvidia=id=>id.includes('/');
const apiOf=id=>isNvidia(id)?'nvidia':'ollama';

function setCat(c){cat=c;document.getElementById('tab-local').className=c==='local'?'act':'';
  document.getElementById('tab-cloud').className=c==='cloud'?'act':'';
  const list=MODELS.filter(m=>m[4]===c);
  if(!list.some(m=>m[0]===sel)) sel=list[0][0];
  document.getElementById('modelSel').innerHTML=list.map(([id,ram,iq,lbl])=>{
    const rec=(c==='local'&&id===st.recommend)?'  · recomendado':'';
    return `<option value="${id}" ${id===sel?'selected':''}>${id} — ${ram}${rec}</option>`;}).join('');
  onSel();
}
function onSel(){
  sel=document.getElementById('modelSel').value;
  const m=MODELS.find(x=>x[0]===sel)||[];
  document.getElementById('modelInfo').innerHTML=`inteligencia <b>${stars(m[2]||3)}</b> · ${m[3]||''}`+
    (cat==='cloud'?'<span class="tag">no gasta tu RAM</span>':'<span class="tag">se libera a los 30 s</span>');
  document.getElementById('btnPull').style.display=cat==='cloud'?'none':'';
}
async function refresh(){
  st=await (await fetch('/api/status')).json();
  if(cat==='local'&&!st.models.includes(sel)) sel=st.recommend;
  document.getElementById('status').innerHTML=`
    <div class="card"><h3>RAM del equipo</h3><div class="v">${st.ram} GB</div></div>
    <div class="card"><h3>Dependencias</h3><div class="v ${st.deps_ok?'ok':'bad'}">${st.deps_ok?'OK':'faltan'}</div></div>
    <div class="card"><h3>Ollama</h3><div class="v ${st.ollama?'ok':'bad'}">${st.ollama?'instalado':'no'}</div></div>
    <div class="card"><h3>Clawd</h3><div class="v ${st.service==='active'?'ok':''}">${st.service}</div></div>`;
  setCat(cat);
  document.getElementById('btnInstall').onclick=()=>go('install',{model:sel,api:apiOf(sel)}).then(()=>go('start'));
  document.getElementById('btnPull').onclick=()=>apiOf(sel)==='nvidia'?log('Los modelos de nube no se descargan: se usan al instante.'):go('pull',{model:sel});
}
async function go(action,body={}){
  busy('Ejecutando '+action+'…');
  try{const r=await (await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
      log('✔ '+r.message);}
  catch(e){log('✖ '+e);}
  await refresh();
}
refresh();
</script>
</body>
</html>
